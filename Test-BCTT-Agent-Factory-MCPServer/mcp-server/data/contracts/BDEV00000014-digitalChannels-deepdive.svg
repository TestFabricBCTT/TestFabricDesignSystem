    <text x="400" y="196" fill="#1565C0" font-size="8" font-weight="600">/term-deposits/new</text>
    <rect x="600" y="159" width="68" height="18" rx="9" fill="#E65100"/><text x="634" y="171" text-anchor="middle" fill="#FFF" font-size="8" font-weight="700">AUTH</text>
    <text x="394" y="220" fill="#37474F" font-size="10">&#9654; GET /api/v1/term-deposits/product-info</text>
    <text x="394" y="236" fill="#37474F" font-size="10">&#9654; POST /api/v1/term-deposits/simulate</text>
    <text x="394" y="252" fill="#37474F" font-size="10">&#9654; GET /api/v1/term-deposits/eligibility/:accountId</text>
    <text x="394" y="268" fill="#37474F" font-size="10">&#9654; POST /api/v1/term-deposits</text>
    <text x="394" y="300" fill="#2E7D32" font-size="9">&#128190; reads product-info</text>
    <text x="394" y="314" fill="#2E7D32" font-size="9">&#128190; writes product-info</text>
  </g>
  <g filter="url(#shadowLight)">
