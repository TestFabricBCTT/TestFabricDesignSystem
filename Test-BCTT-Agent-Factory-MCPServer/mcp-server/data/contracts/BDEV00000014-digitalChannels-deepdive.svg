    <rect x="74" y="184" width="auto" height="16" rx="8" fill="#BBDEFB"/>
    <text x="80" y="196" fill="#1565C0" font-size="8" font-weight="600">/term-deposits</text>
    <rect x="280" y="159" width="68" height="18" rx="9" fill="#E65100"/><text x="314" y="171" text-anchor="middle" fill="#FFF" font-size="8" font-weight="700">AUTH</text>
