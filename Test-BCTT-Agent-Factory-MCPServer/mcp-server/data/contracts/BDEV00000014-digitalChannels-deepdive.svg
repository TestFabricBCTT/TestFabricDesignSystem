    <rect x="380" y="155" width="300" height="28" rx="8" fill="#1E88E5" opacity="0.12"/>
    <rect x="380" y="175" width="300" height="8" fill="#1E88E5" opacity="0.12"/>
    <text x="394" y="174" fill="#1565C0" font-size="11" font-weight="700">CreateTermDepositPage</text>
