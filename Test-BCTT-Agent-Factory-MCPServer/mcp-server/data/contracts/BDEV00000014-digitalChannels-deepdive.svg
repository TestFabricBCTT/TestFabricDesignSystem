    <rect x="700" y="155" width="300" height="28" rx="8" fill="#1E88E5" opacity="0.12"/>
    <rect x="700" y="175" width="300" height="8" fill="#1E88E5" opacity="0.12"/>
    <text x="714" y="174" fill="#1565C0" font-size="11" font-weight="700">TermDepositDetailPage</text>
    <rect x="714" y="184" width="auto" height="16" rx="8" fill="#BBDEFB"/>
    <text x="720" y="196" fill="#1565C0" font-size="8" font-weight="600">/term-deposits/:id</text>
    <rect x="920" y="159" width="68" height="18" rx="9" fill="#E65100"/><text x="954" y="171" text-anchor="middle" fill="#FFF" font-size="8" font-weight="700">AUTH</text>
    <text x="714" y="220" fill="#37474F" font-size="10">&#9654; PUT /api/v1/term-deposits/:id/reinforce</text>
    <text x="714" y="236" fill="#37474F" font-size="10">&#9654; DELETE /api/v1/term-deposits/:id/redeem</text>
    <text x="714" y="252" fill="#37474F" font-size="10">&#9654; PUT /api/v1/term-deposits/:id/renew</text>
    
  </g>
  <g filter="url(#shadowLight)">
    <rect x="1020" y="155" width="300" height="140" rx="8" fill="#E3F2FD" stroke="#90CAF9" stroke-width="0.8"/>
    <rect x="1020" y="155" width="300" height="28" rx="8" fill="#1E88E5" opacity="0.12"/>
    <rect x="1020" y="175" width="300" height="8" fill="#1E88E5" opacity="0.12"/>
    <text x="1034" y="174" fill="#1565C0" font-size="11" font-weight="700">TermDepositHistoryPage</text>
    <rect x="1034" y="184" width="auto" height="16" rx="8" fill="#BBDEFB"/>
    <text x="1040" y="196" fill="#1565C0" font-size="8" font-weight="600">/term-deposits/history</text>
    <rect x="1240" y="159" width="68" height="18" rx="9" fill="#E65100"/><text x="1274" y="171" text-anchor="middle" fill="#FFF" font-size="8" font-weight="700">AUTH</text>
    <text x="1034" y="220" fill="#37474F" font-size="10">&#9654; GET /api/v1/term-deposits/history/:accountId</text>
    
  </g>
  
  <!-- Microservices Container -->
  <g filter="url(#shadow)">
    <rect x="40" y="460" width="1320" height="196" rx="10" fill="#FFF" stroke="#FFE0B2" stroke-width="1"/>
    <rect x="40" y="460" width="1320" height="42" rx="10" fill="url(#gradOrange)"/>
    <rect x="40" y="490" width="1320" height="12" fill="url(#gradOrange)"/>
