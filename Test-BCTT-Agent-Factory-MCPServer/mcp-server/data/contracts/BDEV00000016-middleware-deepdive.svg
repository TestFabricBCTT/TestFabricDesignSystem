<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 774" width="1400" height="774" font-family="Arial, Helvetica, sans-serif">
  
  <defs>
    <linearGradient id="gradBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196F3"/><stop offset="100%" stop-color="#1976D2"/>
    </linearGradient>
    <linearGradient id="gradOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9800"/><stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
    <linearGradient id="gradGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4CAF50"/><stop offset="100%" stop-color="#388E3C"/>
    </linearGradient>
    <linearGradient id="gradGrey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#607D8B"/><stop offset="100%" stop-color="#455A64"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9C27B0"/><stop offset="100%" stop-color="#7B1FA2"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFBFC"/><stop offset="100%" stop-color="#F0F2F5"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000022"/>
    </filter>
    <filter id="shadowLight" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000015"/>
    </filter>
    <marker id="arrowRest" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#37474F"/>
    </marker>
    <marker id="arrowSocket" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7B1FA2"/>
    </marker>
  </defs>
  <rect width="1400" height="774" fill="url(#bgGrad)"/>

  <!-- Title -->
  <rect x="0" y="0" width="1400" height="72" fill="#263238" opacity="0.95"/>
  <text x="700" y="32" text-anchor="middle" fill="#FFF" font-size="20" font-weight="700">BDEV00000016 &#8212; Middleware Deep Dive</text>
  <text x="700" y="54" text-anchor="middle" fill="#B0BEC5" font-size="12">Análise detalhada &#8212; 2026-02-13</text>
  <rect x="520" y="62" width="360" height="2" rx="1" fill="#2196F3" opacity="0.7"/>

  
  
  
  
  
  <!-- Implementation Tasks -->
  <g filter="url(#shadow)">
    <rect x="40" y="200" width="1320" height="230" rx="10" fill="#FFF" stroke="#B0BEC5" stroke-width="1"/>
    <text x="60" y="224" fill="#37474F" font-size="13" font-weight="700">&#9776; Tarefas de Implementação (10)</text>
    <text x="80" y="250" fill="#37474F" font-size="10">&#9654; Configurar proxy routes para 39 endpoints mortgage (27 cliente + 12 backoffice) no middleware <tspan fill="#78909C" font-size="8">(BCTT-539)</tspan></text>
  <text x="80" y="268" fill="#37474F" font-size="10">&#9654; Implementar validação JWT e extracção de roles para rotas mortgage <tspan fill="#78909C" font-size="8">(BCTT-539)</tspan></text>
  <text x="80" y="286" fill="#37474F" font-size="10">&#9654; Implementar rate limiting Redis: global 100 req/min, CRC 1/dia por userId, backoffice 200/min <tspan fill="#78909C" font-size="8">(BCTT-541)</tspan></text>
  <text x="80" y="304" fill="#37474F" font-size="10">&#9654; Implementar role-based access control para backoffice (gestor_L1/L2/L3, avaliador, admin) <tspan fill="#78909C" font-size="8">(BCTT-544)</tspan></text>
  <text x="80" y="322" fill="#37474F" font-size="10">&#9654; Implementar circuit breaker para endpoint disburse (Core Banking): timeout 30s, retries 3, fallback pending <tspan fill="#78909C" font-size="8">(BCTT-545)</tspan></text>
  <text x="80" y="340" fill="#37474F" font-size="10">&#9654; Configurar upload proxy: timeout 60s, max 5MB PDF / 2MB imagens, multipart/form-data <tspan fill="#78909C" font-size="8">(BCTT-540)</tspan></text>
  <text x="80" y="358" fill="#37474F" font-size="10">&#9654; Implementar métricas Prometheus e logging estruturado JSON com correlationId <tspan fill="#78909C" font-size="8">(BCTT-539)</tspan></text>
  <text x="80" y="376" fill="#37474F" font-size="10">&#9654; Configurar CORS para backoffice (domínios específicos) <tspan fill="#78909C" font-size="8">(BCTT-544)</tspan></text>
  <text x="80" y="394" fill="#37474F" font-size="10">&#9654; Implementar validação granular: gestor_L1 só pode approve se loanAmount ≤ 400000 <tspan fill="#78909C" font-size="8">(BCTT-544)</tspan></text>
  <text x="80" y="412" fill="#37474F" font-size="10">&#9654; Configurar Socket.IO namespace /backoffice com filtro por role no middleware <tspan fill="#78909C" font-size="8">(BCTT-550)</tspan></text>
  </g>
  
  <!-- Strategy + Gaps -->
  <g filter="url(#shadow)">
    <rect x="40" y="450" width="1320" height="284" rx="10" fill="#FFF" stroke="#CFD8DC" stroke-width="1"/>
    <text x="60" y="474" fill="#37474F" font-size="13" font-weight="700">&#128260; Análise</text>
    
    <text x="80" y="510" fill="#37474F" font-size="10">Middleware actua como proxy entre Digital Channels e Core. Gere autenticação JWT, validação de roles (gestor_L1/L2/L3, avaliador, admin), rate limiting (global 100 req/min, CRC 1/dia, backoffice 200/min), circuit breaker para Core Banking (timeout 30s), e logging estruturado JSON. Rotas backoffice protegidas por role-based access control.</text>
    <text x="80" y="550" fill="#C62828" font-size="9">&#9888; Definir política de rate limiting exacta para CRC (1 req/dia por userId ou por applicationId?)</text>
  <text x="80" y="566" fill="#C62828" font-size="9">&#9888; Validação CORS para backoffice — confirmar domínios permitidos</text>
  <text x="80" y="582" fill="#C62828" font-size="9">&#9888; Política de timeout para uploads de documentos (ficheiros grandes)</text>
    <text x="80" y="618" fill="#1565C0" font-size="9">&#128161; Circuit breaker para Core Banking: timeout 30s, max retries 3, fallback status=pending</text>
  <text x="80" y="634" fill="#1565C0" font-size="9">&#128161; Redis para rate limiting (sliding window) — key por userId + endpoint</text>
  <text x="80" y="650" fill="#1565C0" font-size="9">&#128161; Métricas Prometheus: latência, taxa erro, rate limit hits</text>
  <text x="80" y="666" fill="#1565C0" font-size="9">&#128161; Logs estruturados JSON para auditoria (correlationId em todos requests)</text>
  <text x="80" y="682" fill="#1565C0" font-size="9">&#128161; Validação de roles granular: gestor_L1 só vê e opera até 400k</text>
  <text x="80" y="698" fill="#1565C0" font-size="9">&#128161; Upload: timeout 60s, max size 5MB PDF / 2MB imagens</text>
  </g>

  <!-- Footer -->
  <text x="700" y="764" text-anchor="middle" fill="#90A4AE" font-size="8">BCTT Agent Factory &#8212; TAA Deep Dive &#8212; 2026-02-13</text>
</svg>