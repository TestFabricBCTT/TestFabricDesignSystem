# =============================================================================
# Agent Factory Demo — Nginx Reverse Proxy
# Mapeia URLs custom (*.DCsCreatedbyAI.pt) para portas localhost
# Requer: hosts file com entradas 127.0.0.1 para cada subdomínio
# =============================================================================

# DigitalChannels Frontend (app cliente)
server {
    listen 80;
    server_name www.DCsCreatedbyAI.pt;

    location / {
        proxy_pass http://host.docker.internal:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support (Vite HMR)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

