# SonarQube Dashboard
server {
    listen 80;
    server_name sonarqube.DCsCreatedbyAI.pt;
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $upstream_sonar http://host.docker.internal:9000;

    # SonarQube needs larger body for scanner uploads
    client_max_body_size 50m;

    location / {
        proxy_pass $upstream_sonar;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Keycloak Identity Provider
server {
    listen 80;
    server_name auth.DCsCreatedbyAI.pt;
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $upstream_auth http://host.docker.internal:8080;

    location / {
        proxy_pass $upstream_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keycloak admin console needs larger buffers
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

