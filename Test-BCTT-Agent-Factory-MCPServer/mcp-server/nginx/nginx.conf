# =============================================================================
# Agent Factory Demo — Nginx Reverse Proxy
# Mapeia URLs custom (*.DCsCreatedbyAI.pt) para portas localhost
# Requer: hosts file com entradas 127.0.0.1 para cada subdomínio
# =============================================================================

# DigitalChannels Frontend (app cliente)
server {
    listen 80;
    server_name www.DCsCreatedbyAI.pt;
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $upstream_dc http://host.docker.internal:5173;

    location / {
        proxy_pass $upstream_dc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket support (Vite HMR)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

